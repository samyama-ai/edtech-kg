name: one-question

# TEMPORARY, and the second attempt at #109. Delete with runner-diagnostic.yml.
#
# **The first diagnostic produced a report nobody can read.** Step logs need a
# web session; the API token reads run STATUS and not step output, and has no
# admin scope to list the runner. And every step of that diagnostic carries
# `continue-on-error: true`, so its run always succeeds — which is why its
# "7 runs, 7 successes" was worthless as evidence and had to be retracted.
#
# So this asks ONE question per run and answers it in the only channel that is
# readable from outside: whether the run passed or failed. Dispatch it once per
# capability and read the statuses back.
#
#   success -> the runner has the thing
#   failure -> it does not
#
# No actions, no `continue-on-error`, one step, and the step's exit code IS the
# answer.

on:
  workflow_dispatch:
    inputs:
      check:
        description: "which capability to test"
        required: true
        default: shell

permissions:
  contents: read

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ${{ inputs.check }}
        run: |
          set -eu
          case "${{ inputs.check }}" in
            shell)   echo "a shell ran at all"; exit 0 ;;
            git)     command -v git   >/dev/null && git --version ;;
            python)  command -v python3 >/dev/null && python3 --version ;;
            docker)  command -v docker >/dev/null && docker info >/dev/null ;;
            dns)     getent hosts git.samyama.ai || nslookup git.samyama.ai ;;
            network) timeout 20 git ls-remote https://git.samyama.ai/Samyama.ai/edtech-kg.git >/dev/null ;;
            outbound) timeout 20 curl -fsS https://pypi.org/simple/ >/dev/null ;;
            *) echo "unknown check"; exit 2 ;;
          esac
